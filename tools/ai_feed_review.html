<!doctype html><html lang="sr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEOPS · slepa provera AI tumačenja</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ea;color:#202a30;font:16px/1.55 system-ui}main{max-width:980px;margin:auto;padding:28px}h1,h2,h3{font-weight:540;line-height:1.2}section{border-top:1px solid #9da3a4;padding:28px 0}.panel{background:#fff;border:1px solid #c8c8c2;padding:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.control{background:#edf2f1}label{display:block;margin:12px 0}select,input,textarea,button{font:inherit;color:inherit;border:1px solid #687277;background:#fff;padding:9px;max-width:100%}select,input:not([type=checkbox]),textarea{display:block;width:100%;margin-top:5px}input[type=checkbox]{margin-right:7px}textarea{min-height:70px}button{cursor:pointer}*:focus-visible{outline:3px solid #165c8c;outline-offset:3px}.muted{color:#566066}#progress{position:sticky;top:0;background:#f5f2ea;padding:10px 0;border-bottom:1px solid #c8c8c2;z-index:2}summary{cursor:pointer;font-weight:600}@media(max-width:600px){main{padding:18px}.panel{padding:12px}}
</style>
<main><h1>Slepa provera AI tumačenja</h1><p>Ne vidiš provajdera, model ni prethodnu validatorsku odluku. Proceni samo prikazani tekst prema zamrznutim činjenicama i determinističkoj kontroli.</p>
<p id="sample" class="muted"></p><label>Ime ocenjivača <input id="reviewer" autocomplete="name"></label><label><input type="checkbox" id="independent"> Ocenjujem samostalno, pre otkrivanja modela i stare odluke.</label><label>Učitaj sačuvane ocene <input type="file" id="import" accept="application/json,.json"></label><p id="progress" role="status"></p><div id="items"></div><button id="save">Sačuvaj ocene kao JSON</button><p id="message" role="status"></p></main>
<script>'use strict';const packet=__PACKET__,$=id=>document.getElementById(id),ratings=[['','Izaberi…'],['yes','Da'],['no','Ne'],['uncertain','Ne mogu da utvrdim']],labels={evidence_support:'Da li sve činjenične tvrdnje podržava dokaz?',precision:'Da li su broj, vreme, izvor i prostor precizno pripisani?',novelty_above_control:'Da li tekst dodaje opravdano zapažanje iznad kontrole?',usefulness_above_control:'Da li je korisniji od same determinističke kontrole?',adequate_guardrail:'Da li jasno kaže šta se ne može zaključiti?',causal_error:'Da li tekst pravi uzročnu tvrdnju bez dokaza?'};
$('sample').textContent=packet.sample_state==='ready_for_review'?`Zamrznuto ${packet.selected_size}/${packet.target_size} stavki.`:`Trenutno ${packet.selected_size}/${packet.target_size}; nedostaje ${packet.shortage} stvarnih model-outputa. Ocene su korisne, ali kapija uzorka ostaje otvorena.`;
function select(id,label){const wrap=document.createElement('label');wrap.textContent=label;const s=document.createElement('select');s.id=id;for(const [value,name] of ratings)s.add(new Option(name,value));wrap.append(s);return wrap;}function readable(value){try{return JSON.stringify(JSON.parse(value),null,2)}catch{return value}}
for(const [index,row] of packet.rows.entries()){const sec=document.createElement('section'),h=document.createElement('h2');h.textContent=`${index+1}. Kandidat ${row.id}`;sec.append(h);const out=document.createElement('div');out.className='panel';out.textContent=readable(row.output_text);const hc=document.createElement('h3');hc.textContent='Deterministička kontrola';const control=document.createElement('div');control.className='panel control';control.textContent=[...row.deterministic_control.facts,...row.deterministic_control.missing,row.deterministic_control.limitation].join('\n');const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('div');summary.textContent='Zamrznute činjenice';pre.className='panel';pre.textContent=JSON.stringify(row.context.facts,null,2);details.append(summary,pre);sec.append(out,hc,control,details);for(const criterion of packet.criteria)sec.append(select(row.id+criterion,labels[criterion]));const note=document.createElement('label'),area=document.createElement('textarea');note.textContent='Razlog, sporno mesto ili predlog ispravke';area.id=row.id+'note';note.append(area);sec.append(note);$('items').append(sec);}
function collect(){const rows=[];for(const row of packet.rows){const values={},complete=packet.criteria.every(c=>{values[c]=$(row.id+c).value;return values[c];});if(complete)rows.push({id:row.id,ratings:values,note:$(row.id+'note').value});}return rows;}function progress(){$('progress').textContent=`Ocenjeno ${collect().length} / ${packet.rows.length}`;}document.addEventListener('change',progress);progress();
$('save').onclick=()=>{if(!$('reviewer').value.trim()||!$('independent').checked){$('message').textContent='Unesi ime i potvrdi nezavisno ocenjivanje.';return;}const data={packet_id:packet.packet_id,reviewer:$('reviewer').value.trim(),reviewer_type:'human',independent_before_reveal:true,at:new Date().toISOString(),rows:collect()},url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='beops-ai-annotations.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('message').textContent=`Sačuvano ${data.rows.length} ocena.`;};
$('import').onchange=async()=>{try{const data=JSON.parse(await $('import').files[0].text());if(data.packet_id!==packet.packet_id)throw Error('Datoteka pripada drugom paketu.');$('reviewer').value=data.reviewer||'';$('independent').checked=data.independent_before_reveal===true;for(const row of data.rows||[]){for(const c of packet.criteria)if($(row.id+c))$(row.id+c).value=row.ratings?.[c]||'';if($(row.id+'note'))$(row.id+'note').value=row.note||'';}progress();$('message').textContent='Ocene su učitane.';}catch(error){$('message').textContent='Nije učitano: '+error.message;}};
</script></html>
