<!doctype html><html lang="sr-Latn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEOPS · Kontekst podataka</title><style>
body{background:#f4f1e9;color:#242923;font:16px/1.6 system-ui,sans-serif;margin:0;padding:28px clamp(18px,5vw,80px)}main{max-width:1100px;margin:auto}h1{font:normal 38px Georgia,serif}h2{font:normal 25px Georgia,serif}article{padding:20px 0;border-top:1px solid #b7beb1}a{color:inherit}small{color:#5b655c}.scroll{overflow:auto}table{border-collapse:collapse;min-width:650px;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #b7beb1;padding:8px}button{padding:8px 12px;background:transparent;border:1px solid #889681;color:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:2px solid #4b6540;outline-offset:3px}</style></head><body><main><a href="index.html">← BEOPS</a><h1>Kontekst podataka / Context datasets</h1><p>Period, teritorija i poreklo ostaju uz svaku vrednost. Istorijski podatak nije današnje merenje. / Period, geography and provenance accompany every value. Historical data are not live measurements.</p><div id="catalog">Učitavanje… / Loading…</div></main><script>
const node=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e;};
fetch('context-catalog.json').then(r=>{if(!r.ok)throw Error();return r.json();}).then(c=>{const box=document.getElementById('catalog');box.replaceChildren();for(const d of c.datasets){const a=node('article','');a.append(node('h2',d.title),node('small',d.sid+' · '+(d.edition||d.state)),node('p',d.limitation||''));
if(d.attribution)a.append(node('p',d.attribution));
if(d.latest?.length){const wrap=node('div','');wrap.className='scroll';const t=node('table','');const head=node('tr','');for(const h of ['Teritorija / Territory','Period','Vrednost / Value','Jedinica / Unit'])head.append(node('th',h));t.append(head);for(const r of d.latest){const tr=node('tr','');for(const v of [r.place+' ['+r.territory_id+']',r.period,r.value??'—',r.unit])tr.append(node('td',v));t.append(tr);}wrap.append(t);a.append(wrap);}
if(d.table){const l=node('a','Sve odabrane godine i kategorije / All selected years and categories (JSON)');l.href=d.table;a.append(l);}if(d.url){const p=node('p',''),l=node('a','Izvor / Source');l.href=d.url;l.rel='noopener noreferrer';p.append(l);a.append(p);}box.append(a);}}).catch(()=>document.getElementById('catalog').textContent='Katalog trenutno nije dostupan. / Catalogue unavailable.');
</script></body></html>
