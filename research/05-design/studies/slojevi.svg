<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1030" width="100%" role="img" aria-label="BEOPS layers, axonometric" class="layers-svg">
<style>
.top.plain{fill:var(--field,#FBFAF7);stroke:currentColor;stroke-width:1.1}
.side.plain,.side2.plain{fill:currentColor;fill-opacity:.08;stroke:currentColor;stroke-width:.8;stroke-opacity:.5}
.top.accent{fill:var(--signal,#D93A16);fill-opacity:.10;stroke:var(--signal,#D93A16);stroke-width:1.2}
.side.accent,.side2.accent{fill:var(--signal,#D93A16);fill-opacity:.22;stroke:var(--signal,#D93A16);stroke-width:.8;stroke-opacity:.6}
.top.legal{stroke-dasharray:4 3}
text{font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;fill:currentColor}
text.dim{fill:currentColor;fill-opacity:.62}
text.accent-text{fill:var(--signal,#D93A16)}
.flow line{stroke:currentColor;stroke-opacity:.5;stroke-width:1.2}
.knowbox{fill:none;stroke:currentColor;stroke-opacity:.35;stroke-dasharray:3 3}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".6"/></marker></defs>
<text class="sr-only " x="40" y="44" font-size="18" text-anchor="start" font-weight="600">BEOPS — slojevi opservatorije, aksonometrija</text><text class="en-only " x="40" y="44" font-size="18" text-anchor="start" font-weight="600">BEOPS — the layers of the observatory, axonometric</text><text class="sr-only dim" x="40" y="66" font-size="12" text-anchor="start">od tla na kome mapa stoji do glasa koji govori; ništa iznad ne postoji bez onoga ispod</text><text class="en-only dim" x="40" y="66" font-size="12" text-anchor="start">from the ground the map stands on to the voice that speaks; nothing above exists without what is below</text><g class="know"><rect x="1050" y="610" width="250" height="330" rx="4" class="knowbox"/><text class="sr-only " x="1064" y="638" font-size="13" text-anchor="start" font-weight="600">Znanje pored slojeva</text><text class="en-only " x="1064" y="638" font-size="13" text-anchor="start" font-weight="600">Knowledge beside the layers</text><text class="sr-only dim" x="1064" y="664" font-size="11.5" text-anchor="start">naučna literatura: 2024–26 u šest</text><text class="en-only dim" x="1064" y="664" font-size="11.5" text-anchor="start">the literature: 2024–26 in six</text><text class="sr-only dim" x="1064" y="679" font-size="11.5" text-anchor="start">tema (urbani LLM agenti, senzori,</text><text class="en-only dim" x="1064" y="679" font-size="11.5" text-anchor="start">themes (urban LLM agents, sensing,</text><text class="sr-only dim" x="1064" y="694" font-size="11.5" text-anchor="start">halucinacije, ontologije)</text><text class="en-only dim" x="1064" y="694" font-size="11.5" text-anchor="start">hallucination, ontologies)</text><text class="sr-only dim" x="1064" y="717" font-size="11.5" text-anchor="start">radni dokument v1.1 · pre-paper za</text><text class="en-only dim" x="1064" y="717" font-size="11.5" text-anchor="start">working document v1.1 · pre-paper</text><text class="sr-only dim" x="1064" y="732" font-size="11.5" text-anchor="start">konferenciju</text><text class="en-only dim" x="1064" y="732" font-size="11.5" text-anchor="start">for the conference</text><text class="sr-only dim" x="1064" y="755" font-size="11.5" text-anchor="start">registar izvora S01–S214 ·</text><text class="en-only dim" x="1064" y="755" font-size="11.5" text-anchor="start">source register S01–S214 · organ</text><text class="sr-only dim" x="1064" y="770" font-size="11.5" text-anchor="start">registar organa · ivični slučajevi</text><text class="en-only dim" x="1064" y="770" font-size="11.5" text-anchor="start">register · edge cases ·</text><text class="sr-only dim" x="1064" y="785" font-size="11.5" text-anchor="start">· ispravke</text><text class="en-only dim" x="1064" y="785" font-size="11.5" text-anchor="start">corrections</text><text class="sr-only dim" x="1064" y="808" font-size="11.5" text-anchor="start">dnevnik rada · mapa projekta ·</text><text class="en-only dim" x="1064" y="808" font-size="11.5" text-anchor="start">the work log · the project map ·</text><text class="sr-only dim" x="1064" y="823" font-size="11.5" text-anchor="start">ovaj crtež</text><text class="en-only dim" x="1064" y="823" font-size="11.5" text-anchor="start">this drawing</text></g><g class="layer ground"><polygon class="side plain ground" points="360.0,865.0 560.0,965.0 560.0,985.0 360.0,885.0"/><polygon class="side2 plain ground" points="560.0,965.0 990.0,750.0 990.0,770.0 560.0,985.0"/><polygon class="top plain ground" points="560.0,965.0 990.0,750.0 790.0,650.0 360.0,865.0"/></g><g class="layer static"><polygon class="side plain static" points="360.0,767.0 560.0,867.0 560.0,887.0 360.0,787.0"/><polygon class="side2 plain static" points="560.0,867.0 990.0,652.0 990.0,672.0 560.0,887.0"/><polygon class="top plain static" points="560.0,867.0 990.0,652.0 790.0,552.0 360.0,767.0"/></g><g class="layer periodic"><polygon class="side plain periodic" points="360.0,669.0 560.0,769.0 560.0,789.0 360.0,689.0"/><polygon class="side2 plain periodic" points="560.0,769.0 990.0,554.0 990.0,574.0 560.0,789.0"/><polygon class="top plain periodic" points="560.0,769.0 990.0,554.0 790.0,454.0 360.0,669.0"/></g><g class="layer live"><polygon class="side accent live" points="360.0,571.0 560.0,671.0 560.0,691.0 360.0,591.0"/><polygon class="side2 accent live" points="560.0,671.0 990.0,456.0 990.0,476.0 560.0,691.0"/><polygon class="top accent live" points="560.0,671.0 990.0,456.0 790.0,356.0 360.0,571.0"/></g><g class="layer legal"><polygon class="side plain legal" points="360.0,473.0 560.0,573.0 560.0,593.0 360.0,493.0"/><polygon class="side2 plain legal" points="560.0,573.0 990.0,358.0 990.0,378.0 560.0,593.0"/><polygon class="top plain legal" points="560.0,573.0 990.0,358.0 790.0,258.0 360.0,473.0"/></g><g class="layer organize"><polygon class="side plain organize" points="360.0,375.0 560.0,475.0 560.0,495.0 360.0,395.0"/><polygon class="side2 plain organize" points="560.0,475.0 990.0,260.0 990.0,280.0 560.0,495.0"/><polygon class="top plain organize" points="560.0,475.0 990.0,260.0 790.0,160.0 360.0,375.0"/></g><g class="layer mind"><polygon class="side accent mind" points="360.0,277.0 560.0,377.0 560.0,397.0 360.0,297.0"/><polygon class="side2 accent mind" points="560.0,377.0 990.0,162.0 990.0,182.0 560.0,397.0"/><polygon class="top accent mind" points="560.0,377.0 990.0,162.0 790.0,62.0 360.0,277.0"/></g><g class="layer express"><polygon class="side plain express" points="360.0,179.0 560.0,279.0 560.0,299.0 360.0,199.0"/><polygon class="side2 plain express" points="560.0,279.0 990.0,64.0 990.0,84.0 560.0,299.0"/><polygon class="top plain express" points="560.0,279.0 990.0,64.0 790.0,-36.0 360.0,179.0"/></g><text class="sr-only " x="346" y="871" font-size="14" text-anchor="end" font-weight="600">0 · Podloga</text><text class="en-only " x="346" y="871" font-size="14" text-anchor="end" font-weight="600">0 · Ground</text><text class="sr-only dim" x="346" y="887" font-size="10.5" text-anchor="end">Natural Earth 1:10 mil. (javno vlasništvo): reke,</text><text class="en-only dim" x="346" y="887" font-size="10.5" text-anchor="end">Natural Earth 1:10m (public domain): rivers, lakes,</text><text class="sr-only dim" x="346" y="900" font-size="10.5" text-anchor="end">jezera, izgrađeno tkivo</text><text class="en-only dim" x="346" y="900" font-size="10.5" text-anchor="end">built-up footprint</text><text class="sr-only dim" x="346" y="912" font-size="10.5" text-anchor="end">orijentacija, ne merenje · bez granica opština (svi</text><text class="en-only dim" x="346" y="912" font-size="10.5" text-anchor="end">orientation, not measurement · no municipality</text><text class="sr-only dim" x="346" y="924" font-size="10.5" text-anchor="end">putevi odbijeni)</text><text class="en-only dim" x="346" y="924" font-size="10.5" text-anchor="end">boundaries (every route refused)</text><text class="sr-only " x="346" y="773" font-size="14" text-anchor="end" font-weight="600">1 · Statični i polustatični slojevi</text><text class="en-only " x="346" y="773" font-size="14" text-anchor="end" font-weight="600">1 · Static and semi-static layers</text><text class="sr-only dim" x="346" y="789" font-size="10.5" text-anchor="end">Kontur stanovništvo 2022 (CC BY) na mapi · 6 slojeva u</text><text class="en-only dim" x="346" y="789" font-size="10.5" text-anchor="end">Kontur population 2022 (CC BY) on the map · 6 layers</text><text class="sr-only dim" x="346" y="802" font-size="10.5" text-anchor="end">registru statičnih slojeva</text><text class="en-only dim" x="346" y="802" font-size="10.5" text-anchor="end">in the static register</text><text class="sr-only dim" x="346" y="814" font-size="10.5" text-anchor="end">traju mesecima i godinama: popis, putevi, GHSL,</text><text class="en-only dim" x="346" y="814" font-size="10.5" text-anchor="end">they last months and years: census, roads, GHSL, flood</text><text class="sr-only dim" x="346" y="826" font-size="10.5" text-anchor="end">poplavne zone, službeni list (sledeći)</text><text class="en-only dim" x="346" y="826" font-size="10.5" text-anchor="end">zones, the gazette (next)</text><text class="sr-only " x="346" y="675" font-size="14" text-anchor="end" font-weight="600">2 · Periodični izvori (sati – dani)</text><text class="en-only " x="346" y="675" font-size="14" text-anchor="end" font-weight="600">2 · Periodic sources (hours – days)</text><text class="sr-only dim" x="346" y="691" font-size="10.5" text-anchor="end">9 izvora: SEPA satne srednje vrednosti (32 stanice),</text><text class="en-only dim" x="346" y="691" font-size="10.5" text-anchor="end">9 sources: SEPA hourly means (32 stations), planned</text><text class="sr-only dim" x="346" y="704" font-size="10.5" text-anchor="end">planirana isključenja struje, obaveštenja grada,</text><text class="en-only dim" x="346" y="704" font-size="10.5" text-anchor="end">power outages, City notices, water utility, heating</text><text class="sr-only dim" x="346" y="716" font-size="10.5" text-anchor="end">Vodovod, Elektrane, Vlada RS</text><text class="en-only dim" x="346" y="716" font-size="10.5" text-anchor="end">operator, Government RS</text><text class="sr-only dim" x="346" y="728" font-size="10.5" text-anchor="end">objavljuju u taktu izvora; svaka vrednost nosi sat</text><text class="en-only dim" x="346" y="728" font-size="10.5" text-anchor="end">published on the source's own beat; every value</text><text class="sr-only dim" x="346" y="741" font-size="10.5" text-anchor="end">merenja ili dan objave</text><text class="en-only dim" x="346" y="741" font-size="10.5" text-anchor="end">carries its measurement hour or publication day</text><text class="sr-only accent-text" x="346" y="577" font-size="14" text-anchor="end" font-weight="600">3 · Živa čula (minuti)</text><text class="en-only accent-text" x="346" y="577" font-size="14" text-anchor="end" font-weight="600">3 · Live senses (minutes)</text><text class="sr-only dim" x="346" y="593" font-size="10.5" text-anchor="end">16 izvora na 5–15 min: RHMZ stanice, građanski</text><text class="en-only dim" x="346" y="593" font-size="10.5" text-anchor="end">16 sources at 5–15 min: RHMZ stations, citizen</text><text class="sr-only dim" x="346" y="606" font-size="10.5" text-anchor="end">senzori, parking, 13 feed(ova) vesti</text><text class="en-only dim" x="346" y="606" font-size="10.5" text-anchor="end">sensors, parking, 13 news feeds</text><text class="sr-only dim" x="346" y="618" font-size="10.5" text-anchor="end">život, živost, novost, promena — stalno pribavljanje;</text><text class="en-only dim" x="346" y="618" font-size="10.5" text-anchor="end">life, liveliness, novelty, change — a constant pull; a</text><text class="sr-only dim" x="346" y="630" font-size="10.5" text-anchor="end">prijem nije merenje</text><text class="en-only dim" x="346" y="630" font-size="10.5" text-anchor="end">reception is not a measurement</text><text class="sr-only " x="346" y="479" font-size="14" text-anchor="end" font-weight="600">4 · Pravni okvir i dozvole (kapija)</text><text class="en-only " x="346" y="479" font-size="14" text-anchor="end" font-weight="600">4 · Legal frame and permissions (the gate)</text><text class="sr-only dim" x="346" y="495" font-size="10.5" text-anchor="end">211 zapisa u registru · 25 se čita · 14 imenovanih</text><text class="en-only dim" x="346" y="495" font-size="10.5" text-anchor="end">211 registry records · 25 polled · 14 named refusals</text><text class="sr-only dim" x="346" y="508" font-size="10.5" text-anchor="end">odbijanja koja se ne zaobilaze</text><text class="en-only dim" x="346" y="508" font-size="10.5" text-anchor="end">never circumvented</text><text class="sr-only dim" x="346" y="520" font-size="10.5" text-anchor="end">zahvat dozvole pre svakog čitanja; knjiga zahvata;</text><text class="en-only dim" x="346" y="520" font-size="10.5" text-anchor="end">a permission capture before any reading; the ledger; a</text><text class="sr-only dim" x="346" y="532" font-size="10.5" text-anchor="end">nedeljna ponovna provera; ivični slučajevi E-001–E-013</text><text class="en-only dim" x="346" y="532" font-size="10.5" text-anchor="end">weekly re-check; edge cases E-001–E-013</text><text class="sr-only " x="346" y="381" font-size="14" text-anchor="end" font-weight="600">5 · Sistem koji organizuje</text><text class="en-only " x="346" y="381" font-size="14" text-anchor="end" font-weight="600">5 · The system that organizes</text><text class="sr-only dim" x="346" y="397" font-size="10.5" text-anchor="end">sakupljač: kapija → prijem → red → dedupe → izvoz</text><text class="en-only dim" x="346" y="397" font-size="10.5" text-anchor="end">the collector: gate → reception → row → dedupe →</text><text class="sr-only dim" x="346" y="410" font-size="10.5" text-anchor="end">(svakih 5 min) · potvrde i za neuspehe</text><text class="en-only dim" x="346" y="410" font-size="10.5" text-anchor="end">export (every 5 min) · receipts even for failures</text><text class="sr-only dim" x="346" y="422" font-size="10.5" text-anchor="end">pet stanja: izmereno / bez vremena / procenjeno /</text><text class="en-only dim" x="346" y="422" font-size="10.5" text-anchor="end">five states: observed / untimed / estimated / forecast</text><text class="sr-only dim" x="346" y="434" font-size="10.5" text-anchor="end">prognoza / nedostupno · ispravke se dopisuju, ništa se</text><text class="en-only dim" x="346" y="434" font-size="10.5" text-anchor="end">/ unavailable · corrections appended, nothing deleted</text><text class="sr-only accent-text" x="346" y="283" font-size="14" text-anchor="end" font-weight="600">6 · Sistem koji misli i govori</text><text class="en-only accent-text" x="346" y="283" font-size="14" text-anchor="end" font-weight="600">6 · The system that thinks and speaks</text><text class="sr-only dim" x="346" y="299" font-size="10.5" text-anchor="end">organele (povezivač istih događaja, ocena iznenađenja)</text><text class="en-only dim" x="346" y="299" font-size="10.5" text-anchor="end">organelles (same-event linker, surprise ranker) ·</text><text class="sr-only dim" x="346" y="312" font-size="10.5" text-anchor="end">· tri entiteta: Posmatrač, Sumnjalo, Povezivač · glas</text><text class="en-only dim" x="346" y="312" font-size="10.5" text-anchor="end">three entities: Observer, Skeptic, Connector · a voice</text><text class="sr-only dim" x="346" y="324" font-size="10.5" text-anchor="end">na ekavici</text><text class="en-only dim" x="346" y="324" font-size="10.5" text-anchor="end">in ekavian Serbian</text><text class="sr-only dim" x="346" y="336" font-size="10.5" text-anchor="end">svaka rečenica proverena kodom (brojevi samo iz</text><text class="en-only dim" x="346" y="336" font-size="10.5" text-anchor="end">every sentence checked by code (numbers only from the</text><text class="sr-only dim" x="346" y="349" font-size="10.5" text-anchor="end">digesta, citati, bez budućnosti kao činjenice,</text><text class="en-only dim" x="346" y="349" font-size="10.5" text-anchor="end">digest, citations, no future as fact, ekavica) ·</text><text class="sr-only dim" x="346" y="362" font-size="10.5" text-anchor="end">ekavica) · tvrdnje se boduju</text><text class="en-only dim" x="346" y="362" font-size="10.5" text-anchor="end">claims are scored</text><text class="sr-only " x="346" y="185" font-size="14" text-anchor="end" font-weight="600">7 · Izraz</text><text class="en-only " x="346" y="185" font-size="14" text-anchor="end" font-weight="600">7 · Expression</text><text class="sr-only dim" x="346" y="201" font-size="10.5" text-anchor="end">scena: monolog + puls (mapa kruži samo kad je</text><text class="en-only dim" x="346" y="201" font-size="10.5" text-anchor="end">the stage: monologue + pulse (the map rings only when</text><text class="sr-only dim" x="346" y="214" font-size="10.5" text-anchor="end">instrument stvarno pročitan) · podaci po stanici i na</text><text class="en-only dim" x="346" y="214" font-size="10.5" text-anchor="end">an instrument was really read) · data per station and</text><text class="sr-only dim" x="346" y="226" font-size="10.5" text-anchor="end">mapi · četiri mape</text><text class="en-only dim" x="346" y="226" font-size="10.5" text-anchor="end">on the map · four maps</text><text class="sr-only dim" x="346" y="238" font-size="10.5" text-anchor="end">sajt objavljen na 10 min · dvojezično ·</text><text class="en-only dim" x="346" y="238" font-size="10.5" text-anchor="end">site published every 10 min · bilingual ·</text><text class="sr-only dim" x="346" y="251" font-size="10.5" text-anchor="end">ai_generated=true na svakoj misli</text><text class="en-only dim" x="346" y="251" font-size="10.5" text-anchor="end">ai_generated=true on every thought</text><g class="flow"><line x1="1020" y1="564" x2="1020" y2="492" marker-end="url(#arrow)"/><line x1="1020" y1="466" x2="1020" y2="394" marker-end="url(#arrow)"/><line x1="1020" y1="368" x2="1020" y2="296" marker-end="url(#arrow)"/><line x1="1020" y1="270" x2="1020" y2="198" marker-end="url(#arrow)"/><line x1="1020" y1="172" x2="1020" y2="100" marker-end="url(#arrow)"/><text class="sr-only dim" x="1030" y="462" font-size="11" text-anchor="start">prijem</text><text class="en-only dim" x="1030" y="462" font-size="11" text-anchor="start">reception</text><text class="sr-only dim" x="1030" y="364" font-size="11" text-anchor="start">dozvola</text><text class="en-only dim" x="1030" y="364" font-size="11" text-anchor="start">permission</text><text class="sr-only dim" x="1030" y="266" font-size="11" text-anchor="start">red, potvrda</text><text class="en-only dim" x="1030" y="266" font-size="11" text-anchor="start">row, receipt</text><text class="sr-only dim" x="1030" y="168" font-size="11" text-anchor="start">digest → misao</text><text class="en-only dim" x="1030" y="168" font-size="11" text-anchor="start">digest → thought</text></g><text class="sr-only dim" x="600" y="957" font-size="10.5" text-anchor="start">mapa ne meri: ona samo kruži tamo gde je instrument stvarno pročitan</text><text class="en-only dim" x="600" y="957" font-size="10.5" text-anchor="start">the map measures nothing: it only rings where an instrument was actually read</text></svg>