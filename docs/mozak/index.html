/* ---------- slajdovi: tvrdnja + jedan konkretan red ---------- */
const S=[
 {k:'8. FMBAS · Value Beyond the Building · Novi Sad, 26.11.2026',h:'BEOPS – <b>Mozak Beograda</b>',p:'Od inteligentnih zgrada do inteligentnih gradova',cam:[[-44,20,52],[-14,9,2]]},

 {k:'Digitalni blizanac',h:'Blizanac grada nastaje tek kad se <b>ostrva povežu</b>.',p:'Povezati, modelovati, podržati odluku. Odluku i dalje donosi struka.',cam:[[-55,60,90],[0,0,8]]},
 {k:'Ideja',h:'Mozak grada nije kontrolna soba. To je <b>mreža bez centra</b>.',p:'Mesto gde javni podaci postaju zajedničko i proverljivo znanje.',cam:[[0,22,95],[0,26,0]]},
 {k:'Šta mora da ume',h:'Opaža. Pamti. Sumnja. I <b>kaže šta ne zna</b>.',p:'Četvrta osobina je najređa i najvažnija.',cam:[[-10,75,95],[-16,17,10]]},
 {k:'BEOPS · stanje 24.11.2026',h:'Za sedam dana BEOPS je odbio <b>19 od 47</b> sopstvenih misli.',p:'Svaka odbijena misao ima ispisan razlog. Posmatrač opaža, Sumnjalo proverava, Povezivač spaja.',cam:[[34,26,44],[14,6,12]]},

 {k:'Kuda može da raste',h:'Mozak kvarta, kampusa, <b>zgrade</b> — i mreža gradova.',p:'<b>Most ka zgradama</b>: BMS i mozak grada razmenjuju ono što oboje znaju. Uz to pitanja građana i scenariji „šta ako“.',tag:'ideje, ne postojeće funkcije',cam:[[50,120,170],[-15,0,-90]]},
 {k:'Uslovi',h:'Pametan grad bez poverenja je <b>samo nadzor</b>.',p:'Otvorenost · privatnost · proverljivost · čovek odlučuje.',cam:[[-70,14,70],[0,4,0]]},
 {k:'Poziv',h:'Zgrade su <b>prvi neuroni</b> grada.',p:'Povežimo zgrade sa javnim znanjem grada.<br>Dizajn i priprema: SVEMIR',cam:[[-33,19,29],[-10,9.4,6]]},
];
const N=S.length;

/* ---------- renderer, scena ---------- */
const R=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:SHOT||Q.has("pdf")});
R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);
document.body.prepend(R.domElement);
const sc=new T.Scene();sc.background=new T.Color(C.noc);sc.fog=new T.Fog(C.noc,120,420);
const cam=new T.PerspectiveCamera(42,innerWidth/innerHeight,0.5,2000);
sc.add(new T.HemisphereLight(0x8fb0d8,0x0b1424,1.1));
const sun=new T.DirectionalLight(0xffe2b8,1.3);sun.position.set(-60,90,40);sc.add(sun);

/* deterministički slučaj */
let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);

/* ---------- reke (stilizovano: Sava sa jugozapada, Dunav sa severozapada, ušće kod Kalemegdana) ---------- */
const V=(x,z)=>new T.Vector3(x,0,z);
const dunav=new T.CatmullRomCurve3([V(-120,-95),V(-75,-58),V(-38,-27),V(-8,-6),V(18,-12),V(45,-30),V(85,-46),V(140,-52)]).getPoints(160);
const sava=new T.CatmullRomCurve3([V(-110,95),V(-62,62),V(-36,34),V(-18,12),V(-8,-6)]).getPoints(90);
function ribbon(pts,w,y){const p=[],idx=[];for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];const d=new T.Vector3().subVectors(b,a).normalize();const n=new T.Vector3(-d.z,0,d.x).multiplyScalar(w/2);p.push(pts[i].x+n.x,y,pts[i].z+n.z,pts[i].x-n.x,y,pts[i].z-n.z);if(i)idx.push(2*i-2,2*i-1,2*i,2*i-1,2*i+1,2*i);}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(p,3));g.setIndex(idx);return g;}
const tlo=new T.Mesh(new T.CircleGeometry(600,64).rotateX(-Math.PI/2),new T.MeshLambertMaterial({color:C.tlo}));tlo.position.y=-0.05;sc.add(tlo);
for(const [pts,w] of [[dunav,9],[sava,5]]){
 sc.add(new T.Mesh(ribbon(pts,w,0.02),new T.MeshBasicMaterial({color:C.reka,side:2})));
 for(const s of [1,-1]){const e=pts.map((q,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];const d=new T.Vector3().subVectors(b,a).normalize();return new T.Vector3(q.x-d.z*s*w/2,0.05,q.z+d.x*s*w/2);});
  sc.add(new T.Line(new T.BufferGeometry().setFromPoints(e),new T.LineBasicMaterial({color:C.rekaL,transparent:true,opacity:.7})));}
}
const distTo=(pts,x,z)=>{let m=1e9;for(const q of pts){const d=(q.x-x)**2+(q.z-z)**2;if(d<m)m=d;}return Math.sqrt(m);};
const interp=(pts,key,val,out)=>{for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if((a[key]-val)*(b[key]-val)<=0&&a[key]!==b[key]){const t=(val-a[key])/(b[key]-a[key]);return a[out]+t*(b[out]-a[out]);}}return null;};

/* ---------- blokovi: Novi Beograd (pravilna mreža), Stari grad i Vračar (gušće, zarotirano) ---------- */
const HERO=new T.Vector3(-10,0,6);
const boxes=[];
function tryBox(x,z,w,d,h,rot){
 if(distTo(dunav,x,z)<w+6||distTo(sava,x,z)<w+4)return;
 const dz=interp(dunav,'x',x,'z');if(dz!==null&&z<dz)return;           // leva obala Dunava ostaje prazna (Ada Huja/ritovi stilizovano)
 if(Math.hypot(x-6,z+4)<7)return;                                       // Kalemegdan: park
 if(Math.hypot(x-HERO.x,z-HERO.z)<5)return;
 if(Math.hypot(x,z-8)>95)return;
 boxes.push({x,z,w,d,h,rot});
}
for(let x=-80;x<-6;x+=6.2)for(let z=-40;z<70;z+=6.2){const sx=interp(sava,'z',z,'x');if(sx!==null&&x>sx)continue;if(sx===null&&z>0)continue;
 const tower=rnd()<.07;tryBox(x+rnd()*.6,z+rnd()*.6,3.8,3.8,tower?7+rnd()*7:1+rnd()*2.6,0);}
for(let i=-34;i<34;i++)for(let j=-6;j<40;j++){const a=.42,u=i*2.7,v=j*2.7;const x=6+u*Math.cos(a)-v*Math.sin(a),z=2+u*Math.sin(a)+v*Math.cos(a);
 const sx=interp(sava,'z',z,'x');if(sx!==null&&x<sx)continue;if(rnd()<.3)continue;tryBox(x,z,1.9,1.9,.6+rnd()*rnd()*4.2,a);}
{const g=new T.BoxGeometry(1,1,1).translate(0,.5,0);const im=new T.InstancedMesh(g,new T.MeshLambertMaterial({color:0x1a2f4f}),boxes.length);
 const m=new T.Matrix4(),pos=[];
 boxes.forEach((b,i)=>{m.compose(new T.Vector3(b.x,0,b.z),new T.Quaternion().setFromAxisAngle(new T.Vector3(0,1,0),-b.rot),new T.Vector3(b.w,b.h,b.d));im.setMatrixAt(i,m);
  const c=[[-.5,0,-.5],[.5,0,-.5],[.5,0,.5],[-.5,0,.5]].map(([a,,cc])=>new T.Vector3(a,0,cc).applyMatrix4(m)),t=[[-.5,1,-.5],[.5,1,-.5],[.5,1,.5],[-.5,1,.5]].map(([a,bb,cc])=>new T.Vector3(a,bb,cc).applyMatrix4(m));
  for(let k=0;k<4;k++){const n=(k+1)%4;pos.push(...t[k].toArray(),...t[n].toArray(),...c[k].toArray(),...t[k].toArray());}});
 sc.add(im);const lg=new T.BufferGeometry();lg.setAttribute('position',new T.Float32BufferAttribute(pos,3));
 sc.add(new T.LineSegments(lg,new T.LineBasicMaterial({color:C.zgr,transparent:true,opacity:.75})));}

/* ---------- zgrada-junak: spratovi + pet tokova (nervni sistem) ---------- */
const hero=new T.Group();hero.position.copy(HERO);sc.add(hero);
{const h=16,w=4.4;const g=new T.BoxGeometry(w,h,w).translate(0,h/2,0);
 hero.add(new T.Mesh(g,new T.MeshLambertMaterial({color:0x22385c,transparent:true,opacity:.55})));
 hero.add(new T.LineSegments(new T.EdgesGeometry(g),new T.LineBasicMaterial({color:C.amber})));
 const fl=[];for(let y=1.6;y<h;y+=1.6){const s=w/2;fl.push(-s,y,-s,s,y,-s,s,y,-s,s,y,s,s,y,s,-s,y,s,-s,y,s,-s,y,-s);}
 const fg=new T.BufferGeometry();fg.setAttribute('position',new T.Float32BufferAttribute(fl,3));hero.add(new T.LineSegments(fg,new T.LineBasicMaterial({color:C.amber,transparent:true,opacity:.28})));}
const nerv=[];{const cols=[C.amber,C.tirkiz,0x7fb7ff,C.magla,C.crvena];
 for(let i=0;i<5;i++){const x=-1.4+i*.7;const ln=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(x,.2,0),new T.Vector3(x,15.6,0)]),new T.LineBasicMaterial({color:cols[i],transparent:true,opacity:0}));hero.add(ln);
  const p=new T.Mesh(new T.SphereGeometry(.22,10,8),new T.MeshBasicMaterial({color:cols[i],transparent:true,opacity:0}));hero.add(p);nerv.push({ln,p,x,o:i*.37});}}

/* ---------- ostrva podataka ---------- */
const ISL=[['vazduh',13,12],['vazduh',-32,20],['vazduh',24,32],['vazduh',-52,-22],['saobraćaj',4,24],['reke',-2,-14],['vreme',34,4],['saobraćaj',-24,44]];
const isl=ISL.map(([n,x,z])=>{const g=new T.Group();g.position.set(x,0,z);sc.add(g);
 const ring=new T.Mesh(new T.RingGeometry(3.4,3.8,48).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:C.tirkiz,transparent:true,opacity:0,side:2}));ring.position.y=.3;g.add(ring);
 const beam=new T.Mesh(new T.CylinderGeometry(.12,.12,10,6).translate(0,5,0),new T.MeshBasicMaterial({color:C.tirkiz,transparent:true,opacity:0}));g.add(beam);
 const pts=[];for(let k=0;k<14;k++){const a=rnd()*6.28,r=rnd()*2.8;pts.push(Math.cos(a)*r,.5+rnd()*2,Math.sin(a)*r);}
 const pg=new T.BufferGeometry();pg.setAttribute('position',new T.Float32BufferAttribute(pts,3));
 const pm=new T.Points(pg,new T.PointsMaterial({color:C.tirkiz,size:.7,transparent:true,opacity:0}));g.add(pm);
 return {n,g,ring,beam,pm,pos:new T.Vector3(x,1,z)};});
/* veze blizanca */
const twinPairs=[];isl.forEach((a,i)=>{isl.map((b,j)=>[a.pos.distanceTo(b.pos),j]).filter(([,j])=>j!==i).sort((p,q)=>p[0]-q[0]).slice(0,2).forEach(([,j])=>{if(i<j||!twinPairs.some(([x,y])=>x===j&&y===i))twinPairs.push([i,j]);});});
const twinLines=twinPairs.map(([i,j])=>{const a=isl[i].pos,b=isl[j].pos;const mid=a.clone().add(b).multiplyScalar(.5);mid.y=6+a.distanceTo(b)*.12;
 const pts=new T.QuadraticBezierCurve3(a,mid,b).getPoints(40);const l=new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:C.tirkiz,transparent:true,opacity:.9}));l.geometry.setDrawRange(0,0);sc.add(l);return l;});

/* ---------- mozak: mreža bez centra iznad grada ---------- */
const BY=28,bn=[];for(let i=0;i<54;i++){const a=rnd()*6.28,r=Math.sqrt(rnd())*58;bn.push(new T.Vector3(Math.cos(a)*r,BY+(rnd()-.5)*7,8+Math.sin(a)*r*.8));}
const brain=new T.Group();sc.add(brain);
const bLinks=[];bn.forEach((a,i)=>bn.map((b,j)=>[a.distanceTo(b),j]).filter(([,j])=>j>i).sort((p,q)=>p[0]-q[0]).slice(0,3).forEach(([,j])=>bLinks.push([i,j])));
const bl=[];bLinks.forEach(([i,j])=>bl.push(...bn[i].toArray(),...bn[j].toArray()));
const blg=new T.BufferGeometry();blg.setAttribute('position',new T.Float32BufferAttribute(bl,3));
const bLineMat=new T.LineBasicMaterial({color:C.amber,transparent:true,opacity:0});brain.add(new T.LineSegments(blg,bLineMat));
const bNodeMat=new T.MeshBasicMaterial({color:C.amber,transparent:true,opacity:0});
bn.forEach(p=>{const m=new T.Mesh(new T.SphereGeometry(.55,10,8),bNodeMat);m.position.copy(p);brain.add(m);});
/* uzlazne niti: ostrva -> mozak */
const up=[];isl.forEach(s=>{let best=bn[0];bn.forEach(b=>{if(b.distanceTo(s.pos)<best.distanceTo(s.pos))best=b;});up.push(...s.pos.toArray(),...best.toArray());});
const upg=new T.BufferGeometry();upg.setAttribute('position',new T.Float32BufferAttribute(up,3));
const upMat=new T.LineDashedMaterial({color:C.tirkiz,dashSize:1,gapSize:1,transparent:true,opacity:0});const upL=new T.LineSegments(upg,upMat);upL.computeLineDistances();sc.add(upL);
const pulses=[];for(let k=0;k<26;k++){const m=new T.Mesh(new T.SphereGeometry(.42,8,6),new T.MeshBasicMaterial({color:0xfff1d6,transparent:true,opacity:0}));brain.add(m);pulses.push({m,l:bLinks[Math.floor(rnd()*bLinks.length)],t:rnd()});}
/* četiri osobine: četiri istaknuta čvora */
const four=[[ 'opaža',0],['pamti',0],['sumnja',0],['kaže šta ne zna',0]];
{const picks=[...bn].map((p,i)=>[p,i]).sort((a,b)=>a[0].distanceTo(new T.Vector3(0,BY,8))-b[0].distanceTo(new T.Vector3(0,BY,8))).slice(0,14);
 four.forEach((f,i)=>f[1]=picks[[1,4,8,12][i]][0]);}
const fourMesh=four.map(([,p],i)=>{const m=new T.Mesh(new T.SphereGeometry(i===3?1.5:1.1,16,12),new T.MeshBasicMaterial({color:i===3?C.amber:C.tirkiz,transparent:true,opacity:0}));m.position.copy(p);sc.add(m);return m;});

/* ---------- merna stanica i odbijena tvrdnja ---------- */
const ST=new T.Vector3(13,0,12);const stn=new T.Group();stn.position.copy(ST);sc.add(stn);
stn.add(new T.Mesh(new T.CylinderGeometry(.12,.12,5,8).translate(0,2.5,0),new T.MeshLambertMaterial({color:0xcfd8e6})));
stn.add(new T.Mesh(new T.BoxGeometry(1.4,.9,.9).translate(0,5.2,0),new T.MeshLambertMaterial({color:0xcfd8e6})));
const claim=new T.Mesh(new T.SphereGeometry(.45,16,12),new T.MeshBasicMaterial({color:C.crvena,transparent:true,opacity:0}));sc.add(claim);
const xMat=new T.LineBasicMaterial({color:C.crvena,transparent:true,opacity:0});
const xg=new T.BufferGeometry();xg.setAttribute('position',new T.Float32BufferAttribute([-1.3,-1.3,0,1.3,1.3,0,-1.3,1.3,0,1.3,-1.3,0],3));
const xMark=new T.LineSegments(xg,xMat);sc.add(xMark);xMark.position.set(ST.x,8.6,ST.z);
const shield=new T.Mesh(new T.RingGeometry(2.2,2.5,48).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:C.crvena,transparent:true,opacity:0,side:2}));shield.position.set(ST.x,7,ST.z);sc.add(shield);

/* ---------- budućnost: krugovi kvarta/kampusa/zgrade + svetla drugih gradova ---------- */
const fut=[];const ringAt=(x,z,r,col)=>{const m=new T.Mesh(new T.RingGeometry(r,r+.9,64).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:col,transparent:true,opacity:0,side:2}));m.position.set(x,.4,z);sc.add(m);fut.push(m);return m;};
ringAt(24,34,14,C.tirkiz);ringAt(-38,22,11,C.tirkiz);ringAt(HERO.x,HERO.z,6,C.amber);
const CITIES=[['Novi Sad',-150,-300],['Pančevo',150,-70],['Smederevo',170,170]];
const cityL=CITIES.map(([n,x,z])=>{const m=new T.Mesh(new T.SphereGeometry(4,16,12),new T.MeshBasicMaterial({color:C.amber,transparent:true,opacity:0}));m.position.set(x,2,z);sc.add(m);fut.push(m);
 const l=new T.Line(new T.BufferGeometry().setFromPoints(new T.QuadraticBezierCurve3(new T.Vector3(0,BY,8),new T.Vector3(x/2,BY+30,z/2),new T.Vector3(x,4,z)).getPoints(50)),new T.LineDashedMaterial({color:C.amber,dashSize:3,gapSize:3,transparent:true,opacity:0}));l.computeLineDistances();sc.add(l);fut.push(l);return m;});
/* uslovi: četiri tačke na prstenu oko grada */
const COND=[['otvorenost',0,-70],['privatnost',75,8],['proverljivost',0,86],['čovek odlučuje',-75,8]];
const condRing=new T.Mesh(new T.RingGeometry(74,75.2,128).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:C.amber,transparent:true,opacity:0,side:2}));condRing.position.set(0,.3,8);sc.add(condRing);
const condP=COND.map(([,x,z])=>{const m=new T.Mesh(new T.CylinderGeometry(1.2,1.2,12,16).translate(0,6,0),new T.MeshBasicMaterial({color:C.amber,transparent:true,opacity:0}));m.position.set(x,0,z);sc.add(m);return m;});

/* ---------- oznake u prostoru ---------- */
const lab=document.getElementById('lab');
const L=[];const label=(txt,v,cls,show)=>{const e=document.createElement('div');e.className='lb '+(cls||'');e.textContent=txt;lab.appendChild(e);L.push({e,v,show});};
label('Ušće Save i Dunava',new T.Vector3(-6,1,-3),'',s=>s>=2&&s<=3);
label('Novi Beograd',new T.Vector3(-30,3,2),'',s=>s>=2&&s<=3);
label('Stari grad',new T.Vector3(18,3,2),'',s=>s===2);
label('Vračar',new T.Vector3(26,3,40),'',s=>s===3);
label('Zemun',new T.Vector3(-58,3,-30),'',s=>s===2);
label('Kalemegdan',new T.Vector3(6,1,-4),'',s=>s===7);
label('zgrada',new T.Vector3(HERO.x,17,HERO.z),'a',s=>s===0);
['energija','voda','vazduh','održavanje','bezbednost'].forEach((n,i)=>label(n,new T.Vector3(HERO.x-1.4+i*.7,15.9-i*2.6,HERO.z+2.3),'a',s=>s===1));
isl.forEach(s=>label(s.n,s.pos.clone().setY(11),'t',x=>x===2));
four.forEach(([n,p],i)=>label(n,p.clone().setY(p.y+2),i===3?'a':'t',s=>s===5));
label('merna stanica',new T.Vector3(ST.x,6,ST.z+.5),'',s=>s===6);
label('„PM10 je porastao“ ✗',new T.Vector3(ST.x,11,ST.z),'r',s=>s===7);
label('izmereno: PM2.5',new T.Vector3(ST.x+.4,6.2,ST.z),'t',s=>s===7);
label('kvart',new T.Vector3(24,2,20),'t',s=>s===8);label('kampus',new T.Vector3(-38,2,11),'t',s=>s===8);label('zgrada · BMS',new T.Vector3(HERO.x,18,HERO.z),'a',s=>s===8);
CITIES.forEach(([n],i)=>label(n,cityL[i].position.clone().setY(9),'a',s=>s===8));
COND.forEach(([n],i)=>label(n,condP[i].position.clone().setY(14),'a',s=>s===9));
label('mozak grada',new T.Vector3(0,BY+9,8),'a',s=>s===4);

/* ---------- stanje po slajdu (ciljne vrednosti, glatko se dostižu) ---------- */
const want=s=>({nerv:+(s===1||s===10),isl:+(s>=2&&s<=7),twin:s>=3?1:0,brain:s>=4?(s===7?.35:1):0,up:+(s>=4&&s<=6),four:+(s===5),claim:+(s===7),fut:+(s===8),cond:+(s===9)});
const cur=want(0);let slide=0,fly=null,tClaim=0;
const ease=t=>1-Math.pow(1-t,3);
function go(n,instant){n=Math.max(0,Math.min(N-1,n));if(n===slide&&!instant&&fly)return;slide=n;
 const [p,t]=S[n].cam;const to={p:new T.Vector3(...p),t:new T.Vector3(...t)};
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(instant||reduce){cam.position.copy(to.p);look.copy(to.t);fly=null;}else fly={fp:cam.position.clone(),ft:look.clone(),to,t0:performance.now(),d:1100};
 if(n===7)tClaim=performance.now();
 if(instant)Object.assign(cur,want(n));
 hud(n);dots();document.getElementById('aut').classList.toggle('big',n===0||n===N-1);document.getElementById('qr').classList.toggle('on',n===N-1);document.getElementById('num').textContent=(n+1)+' / '+N;if(!SHOT)history.replaceState(null,'','#'+(n+1));}
const look=new T.Vector3();
const hudEl=document.getElementById('hud'),hc=document.getElementById('hc');
function hud(n){const s=S[n];hudEl.classList.add('out');setTimeout(()=>{hudEl.className=n===0?'s1':'';
 hc.innerHTML=`<div class="k">${s.k}</div><h1>${s.h}</h1><p>${s.p}</p>${s.tag?`<span class="tag">${s.tag}</span>`:''}`;},SHOT?0:260);}
const dEl=document.getElementById('dots');for(let i=0;i<N;i++){const d=document.createElement('span');d.onclick=()=>go(i);dEl.appendChild(d);}
function dots(){[...dEl.children].forEach((d,i)=>d.classList.toggle('on',i===slide));}

addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){go(slide+1);e.preventDefault();}
 else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){go(slide-1);e.preventDefault();}
 else if(e.key==='Home')go(0);else if(e.key==='End')go(N-1);
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}});
let wl=0;addEventListener('wheel',e=>{const now=performance.now();if(now-wl<900||Math.abs(e.deltaY)<20)return;wl=now;go(slide+(e.deltaY>0?1:-1));},{passive:true});
let tx=null;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)go(slide+(dx<0?1:-1));tx=null;});
R.domElement.addEventListener('click',e=>go(slide+(e.clientX>innerWidth/3?1:-1)));document.getElementById('qr').addEventListener('click',e=>e.stopPropagation());
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});

/* ---------- petlja ---------- */
const vtmp=new T.Vector3();
function frame(now){
 if(fly){const k=Math.min(1,(now-fly.t0)/fly.d),e=ease(k);
  const lift=Math.sin(Math.PI*k)*Math.min(30,fly.fp.distanceTo(fly.to.p)*.18);
  cam.position.lerpVectors(fly.fp,fly.to.p,e);cam.position.y+=lift;look.lerpVectors(fly.ft,fly.to.t,e);if(k>=1)fly=null;}
 cam.lookAt(look);
 const w=want(slide),a=(SHOT||Q.has("pdf"))?1:.06;for(const k in w)cur[k]+=(w[k]-cur[k])*a;
 const t=now/1000;
 nerv.forEach(n=>{n.ln.material.opacity=.85*cur.nerv;n.p.material.opacity=cur.nerv;n.p.position.set(n.x,.2+((t*.35+n.o)%1)*15.4,0);});
 isl.forEach((s,i)=>{const o=cur.isl;s.ring.material.opacity=o*(.6+.3*Math.sin(t*2+i));s.beam.material.opacity=o*.35*(1-cur.twin*.6);s.pm.material.opacity=o;});
 twinLines.forEach((l,i)=>l.geometry.setDrawRange(0,Math.round(41*Math.max(0,Math.min(1,cur.twin*1.6-i*.04)))));
 twinLines.forEach(l=>l.material.opacity=.85*Math.min(1,cur.isl+cur.fut*0));
 bLineMat.opacity=.42*cur.brain;bNodeMat.opacity=.9*cur.brain;upMat.opacity=.5*cur.up;
 pulses.forEach(p=>{p.t=(p.t+.006)%1;const [i,j]=p.l;p.m.position.lerpVectors(bn[i],bn[j],p.t);p.m.material.opacity=cur.brain*(slide===7?.2:1);});
 fourMesh.forEach((m,i)=>{m.material.opacity=cur.four;m.scale.setScalar(1+.18*Math.sin(t*3+i));});
 /* odbijena tvrdnja: pada iz mozga, staje na štitu iznad stanice */
 const ck=(SHOT||Q.has("pdf"))?1:Math.min(1,(now-tClaim)/2200);
 claim.position.set(ST.x,BY-(BY-7.8)*ease(Math.min(1,ck*1.3)),ST.z);claim.material.opacity=cur.claim;
 shield.material.opacity=cur.claim*(ck>.75?.9:.2);xMat.opacity=cur.claim*(ck>.8?1:0);xMark.lookAt(cam.position);
 fut.forEach(m=>m.material.opacity=cur.fut*(m.isLine?.6:.85));
 condRing.material.opacity=.7*cur.cond;condP.forEach(m=>m.material.opacity=.85*cur.cond);
 R.render(sc,cam);
 for(const l of L){const on=l.show(slide);vtmp.copy(l.v).project(cam);const vis=on&&vtmp.z<1&&Math.abs(vtmp.x)<1.05&&Math.abs(vtmp.y)<1.05;
  l.e.classList.toggle('on',vis);if(vis){l.e.style.left=((vtmp.x+1)/2*innerWidth)+'px';l.e.style.top=((1-vtmp.y)/2*innerHeight)+'px';}}
 requestAnimationFrame(frame);}
const start=Q.has('s')?(+Q.get('s')-1):(+(location.hash.slice(1))||1)-1;
go(start,true);requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{});
</script>
